<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="Inter,Segoe UI,system-ui,sans-serif">
<rect width="980" height="470" fill="#ffffff"/>
<text x="40" y="44" fill="#1c1c1e" font-size="20" font-weight="700">More tokens is not the constraint — context is</text>
<text x="40" y="68" fill="#6e6e76" font-size="12.5">Unsegmented token-budget sweep (n=20) against the segmentation arm. Both axes are measured, not assumed.</text>
<line x1="96" y1="380.0" x2="796" y2="380.0" stroke="#e4e4e9"/>
<text x="86" y="384.0" fill="#8e8e96" font-size="11" text-anchor="end">0.00</text>
<text x="96.0" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">0</text>
<line x1="96" y1="330.0" x2="796" y2="330.0" stroke="#e4e4e9"/>
<text x="86" y="334.0" fill="#8e8e96" font-size="11" text-anchor="end">0.14</text>
<text x="98.5" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">8</text>
<line x1="96" y1="280.0" x2="796" y2="280.0" stroke="#e4e4e9"/>
<text x="86" y="284.0" fill="#8e8e96" font-size="11" text-anchor="end">0.28</text>
<text x="100.9" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">16</text>
<line x1="96" y1="230.0" x2="796" y2="230.0" stroke="#e4e4e9"/>
<text x="86" y="234.0" fill="#8e8e96" font-size="11" text-anchor="end">0.42</text>
<text x="103.3" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">24</text>
<line x1="96" y1="180.0" x2="796" y2="180.0" stroke="#e4e4e9"/>
<text x="86" y="184.0" fill="#8e8e96" font-size="11" text-anchor="end">0.56</text>
<text x="105.8" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">32</text>
<line x1="96" y1="130.0" x2="796" y2="130.0" stroke="#e4e4e9"/>
<text x="86" y="134.0" fill="#8e8e96" font-size="11" text-anchor="end">0.70</text>
<text x="108.2" y="400" fill="#8e8e96" font-size="11" text-anchor="middle">40</text>
<line x1="96" y1="130" x2="96" y2="380" stroke="#e4e4e9"/>
<line x1="96" y1="380" x2="796" y2="380" stroke="#e4e4e9"/>
<text x="34" y="255.0" fill="#6e6e76" font-size="11.5" text-anchor="middle" transform="rotate(-90 34 255.0)">Character error rate (lower is better)</text>
<text x="446.0" y="422" fill="#6e6e76" font-size="11.5" text-anchor="middle">Visual tokens per character</text>
<circle cx="158.5" cy="257.2" r="8" fill="#e8a33d" stroke="#ffffff" stroke-width="2"/>
<text x="158.5" y="239.2" fill="#e8a33d" font-size="11.5" font-weight="600" text-anchor="middle">px512  518 tok</text>
<text x="158.5" y="255.2" fill="#6e6e76" font-size="10" text-anchor="middle">downscaled to 1036×392</text>
<circle cx="188.4" cy="267.1" r="8" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
<text x="200.4" y="261.1" fill="#4f46e5" font-size="11.5" font-weight="600" text-anchor="start">whole page  765 tok</text>
<text x="200.4" y="277.1" fill="#6e6e76" font-size="10" text-anchor="start">native 1260×476 — shipped</text>
<circle cx="708.5" cy="163.5" r="8" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
<text x="696.5" y="157.5" fill="#c0392b" font-size="11.5" font-weight="600" text-anchor="end">segmented  ~35 tok</text>
<text x="696.5" y="173.5" fill="#6e6e76" font-size="10" text-anchor="end">6.6× the tokens, and far worse</text>
<text x="188.4" y="307.1" fill="#8e8e96" font-size="10" text-anchor="middle">px2048 plots here too — byte-identical to px1280</text>
<text x="820" y="138" fill="#1c1c1e" font-size="12.5" font-weight="700">Tokens saturate at native</text>
<text x="820" y="160" fill="#6e6e76" font-size="11.2">518 → 765 tok/char: CER 0.344 → 0.316</text>
<text x="820" y="177" fill="#6e6e76" font-size="11.2">px2048 is byte-identical to px1280</text>
<text x="820" y="194" fill="#6e6e76" font-size="11.2">on 20/20 pages — the page is</text>
<text x="820" y="211" fill="#6e6e76" font-size="11.2">already under both ceilings.</text>
<text x="820" y="228" fill="#6e6e76" font-size="11.2"></text>
<text x="820" y="245" fill="#6e6e76" font-size="11.2">So raising the ceiling buys nothing.</text>
<text x="820" y="262" fill="#6e6e76" font-size="11.2">Segmentation supplies 6.6× the tokens</text>
<text x="820" y="279" fill="#6e6e76" font-size="11.2">and is far worse: the context it</text>
<text x="820" y="296" fill="#6e6e76" font-size="11.2">discards costs more than the tokens</text>
<text x="820" y="313" fill="#6e6e76" font-size="11.2">return.</text>
<text x="40" y="444" fill="#6e6e76" font-size="11.5">Lower-left is better. The whole page sits at the best measured point despite using 4.6× fewer tokens than segmentation.</text>
</svg>