<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" font-family="Inter,Segoe UI,system-ui,sans-serif">
<rect width="980" height="430" fill="#ffffff"/>
<text x="40" y="44" fill="#1c1c1e" font-size="20" font-weight="700">Adding a page is free. Destroying a page's structure is not.</text>
<text x="40" y="68" fill="#6e6e76" font-size="12.5">Paired, n=20, every bar at full native resolution. Only the second bar's input contains an extra page.</text>
<text x="206" y="157" fill="#1c1c1e" font-size="12" text-anchor="end">whole page</text>
<rect x="220" y="142" width="139.2" height="22" fill="#4f46e5" rx="3"/>
<text x="368.2" y="158" fill="#4f46e5" font-size="12.5" font-weight="700">0.325</text>
<text x="206" y="203" fill="#1c1c1e" font-size="12" text-anchor="end">whole page + its neighbour (top)</text>
<rect x="220" y="188" width="138.7" height="22" fill="#4f46e5" rx="3"/>
<text x="367.7" y="204" fill="#4f46e5" font-size="12.5" font-weight="700">0.324</text>
<text x="206" y="249" fill="#1c1c1e" font-size="12" text-anchor="end">the neighbour, read second</text>
<rect x="220" y="234" width="150.3" height="22" fill="#4f46e5" rx="3"/>
<text x="379.3" y="250" fill="#4f46e5" font-size="12.5" font-weight="700">0.351</text>
<text x="206" y="295" fill="#1c1c1e" font-size="12" text-anchor="end">page split into line slivers</text>
<rect x="220" y="280" width="259.8" height="22" fill="#c0392b" rx="3"/>
<text x="488.8" y="296" fill="#c0392b" font-size="12.5" font-weight="700">0.606</text>
<line x1="220" y1="132" x2="220" y2="326" stroke="#e4e4e9"/>
<text x="600" y="148" fill="#6e6e76" font-size="11.2" font-weight="400">Paired deltas vs the whole page:</text>
<text x="600" y="165" fill="#6e6e76" font-size="11.2" font-weight="400"></text>
<text x="600" y="182" fill="#6e6e76" font-size="11.2" font-weight="400">  neighbour present    -0.001</text>
<text x="600" y="199" fill="#6e6e76" font-size="11.2" font-weight="400">    worse 10 / better 9 / tie 1</text>
<text x="600" y="216" fill="#6e6e76" font-size="11.2" font-weight="400"></text>
<text x="600" y="233" fill="#6e6e76" font-size="11.2" font-weight="400">  same page, read second  +0.015</text>
<text x="600" y="250" fill="#6e6e76" font-size="11.2" font-weight="400">    95% CI [-0.021, +0.052], p = 0.65</text>
<text x="600" y="267" fill="#6e6e76" font-size="11.2" font-weight="400"></text>
<text x="600" y="284" fill="#c0392b" font-size="11.2" font-weight="700">  line segmentation      +0.290</text>
<text x="600" y="301" fill="#6e6e76" font-size="11.2" font-weight="400">    worse 19 / tie 1, p = 3.8e-06</text>
<text x="600" y="318" fill="#6e6e76" font-size="11.2" font-weight="400"></text>
<text x="600" y="335" fill="#6e6e76" font-size="11.2" font-weight="400">Cross-page context is nearly worthless</text>
<text x="600" y="352" fill="#6e6e76" font-size="11.2" font-weight="400">and nearly free. Within-page structure</text>
<text x="600" y="369" fill="#6e6e76" font-size="11.2" font-weight="400">is neither.</text>
<text x="40" y="406" fill="#6e6e76" font-size="11.5">Character error rate, mean of 20 pages. Lower is better.</text>
</svg>